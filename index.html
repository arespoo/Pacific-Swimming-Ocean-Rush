<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Swimming: Ocean Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameShell">
    <div class="title-section">
      <h1>Pacific Swimming: Ocean Rush</h1>
      <p id="hint">Tap / click / space to swim. Hit the beat for a dash!</p>
    </div>
    <div id="gameWrapper">
      <canvas id="gameCanvas" aria-label="Dolphin Tempo Runner"></canvas>
      <button id="soundToggle" class="sound-toggle" aria-label="Toggle sound" title="Toggle sound on/off">🔊</button>
      <div id="hud">
        <div class="scores">
          <div>Score <span id="score">0</span></div>
          <div>Best <span id="bestScore">0</span></div>
        </div>
      </div>
      <div id="overlay" class="visible">
        <div class="panel">
          <h2>Ocean Rush</h2>
          <div id="dolphinSelect" class="selection-grid">
            <!-- Dolphins will be injected here -->
          </div>
          <p id="selectionHint">Select your dolphin!</p>
          <div class="actions">
            <button id="startButton">Start Race</button>
          </div>
          <div id="leaderboardContainer"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer">
    <span>Made by @Khoa_TwT</span>
  </div>

  <!-- Firebase Configuration & Leaderboard Manager -->
  <script type="module" src="leaderboard.js"></script>
  
  <!-- Leaderboard UI Manager -->
  <script src="leaderboard-ui.js" defer></script>
  
  <!-- Main Game Logic -->
  <script src="main.js" defer></script>
</body>
</html>
