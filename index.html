<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Swimming: Ocean Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameShell">
    <div class="title-section">
      <h1>Pacific Swimming: Ocean Rush</h1>
      <p id="hint">Tap / click / space to swim. Hit the beat for a dash!</p>
    </div>
    <div id="gameWrapper">
      <canvas id="gameCanvas" aria-label="Dolphin Tempo Runner"></canvas>
      <button id="soundToggle" class="sound-toggle" aria-label="Toggle sound" title="Toggle sound on/off">🔊</button>
      <div id="hud">
        <div class="scores">
          <div>Score <span id="score">0</span></div>
          <div>Best <span id="bestScore">0</span></div>
        </div>
      </div>
      <div id="overlay" class="visible">
        <div class="panel">
          <h2>Choose Your Dolphin</h2>
          <p>Pick one of the dolphins below, then start the race. The dolphin you choose becomes your 2D runner in-game.</p>
          <div id="dolphinSelect" class="selection-grid" aria-label="Dolphin selection"></div>
          <p id="selectionHint">Tap an image to choose your dolphin.</p>
          <button id="startButton">Start</button>
        </div>
      </div>
    </div>
  </div>
  <div id="footer">
    <span>Made by @Khoa_TwT</span>
  </div>
  <script src="main.js"></script>
</body>
</html>
